<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>NoteStack</title>
    <script>
      // Single Page Apps for GitHub Pages
      // This script automatically redirects 404s to index.html
      // preserving the path and query string for client-side routing
      
      var pathSegmentsToKeep = 1;
      var basePath = '/notestack-web';
      
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        basePath +
        '/index.html' +
        (l.pathname.split('/').length > pathSegmentsToKeep ? l.pathname : '') +
        l.search + l.hash
      );
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
